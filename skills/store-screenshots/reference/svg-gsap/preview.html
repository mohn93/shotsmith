<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="./style.css">
<style>
  body{width:886px;height:1920px;overflow:hidden;background:#000}
  .stage{transform:scale(.703175);transform-origin:0 0;position:absolute;left:0;top:-2px}
  .scene{will-change:transform}
</style>
<script type="importmap">{"imports":{"gsap":"/node_modules/gsap/index.js"}}</script>
</head><body><div class="stage" id="stage"></div>
<script type="module">
import { gsap } from "gsap";
import { scene1, scene2, scene3, setSrc } from "./scenes.js";
import { loadImages, h, s, arcPath, C } from "./lib.js";
setSrc((n) => `/inputs/v${n}.png`);
await loadImages([1, 2, 3].map((n) => `/inputs/v${n}.png`));
const stage = document.getElementById("stage");
const S1 = scene1(stage), S2 = scene2(stage), S3 = await scene3(stage);
S2.root.style.zIndex = 2; S3.root.style.zIndex = 3;

// Score count-up overlay on the lifted card (vector echo of the real ring; fades back to real pixels).
const card = S1.card;
const k = card.k;
const [rcx, rcy] = [(1213 - 112) * k, (2073 - 1404) * k];
const ov = s("svg", { width: card.w, height: card.h, style: "position:absolute;left:0;top:0;z-index:2;pointer-events:none" }, card.el);
const cover = s("circle", { cx: rcx, cy: rcy, r: 305 * k, fill: "#fff" }, ov);
s("circle", { cx: rcx, cy: rcy, r: 274.5 * k, fill: "none", stroke: "#B2B2B2", "stroke-width": 45 * k }, ov);
const garc = s("path", { d: "", fill: "none", stroke: "#10B981", "stroke-width": 45 * k }, ov);
const num = s("text", { x: 1213.5 * k - 112 * k, y: (2135 - 1404) * k, "text-anchor": "middle", fill: "#10B981",
  style: `font:700 ${154 * k}px Inter;letter-spacing:.01em` }, ov);
const score = { v: 0 };
const drawScore = () => {
  const v = Math.round(score.v);
  garc.setAttribute("d", v > 0 ? arcPath(rcx, rcy, 274.5 * k, 0, Math.max(0.01, v * 3.6)) : "");
  num.textContent = v + "%";
};
drawScore();

// Propagation counter overlay on the lifted chips/bar card (fades back to real pixels at the end).
const bar = S3.bar, bk = bar.k, BX = 30, BY = 1440;
const B = (x, y) => [(x - BX) * bk, (y - BY) * bk];
const ov3 = s("svg", { width: bar.w, height: bar.h, style: "position:absolute;left:0;top:0;z-index:2" }, bar.el);
const rect = (x0, y0, x1, y1, fill) => { const [a, b] = B(x0, y0), [c, d] = B(x1, y1);
  return s("rect", { x: a, y: b, width: c - a, height: d - b, fill }, ov3); };
rect(85, 1732, 310, 1810, "#F8FAFC"); rect(2120, 1732, 2350, 1810, "#F8FAFC");
rect(89, 1848, 2338, 1870, "#E2E8F0");
const fill = rect(89, 1848, 2338, 1870, "#10B981");
const fs = 78 * bk;
const [tx, ty] = B(92, 1799), [px2] = B(2334, 0);
const cnt = s("text", { x: tx, y: ty, fill: "#111827", style: `font:700 ${fs}px Inter` }, ov3);
const pct = s("text", { x: px2, y: ty, fill: "#10B981", "text-anchor": "end", style: `font:700 ${fs}px Inter` }, ov3);
const prog = { v: 0 };
const fullW = (2338 - 89) * bk;
const drawProg = () => { const n = Math.round(prog.v * 23);
  cnt.textContent = `${n}/23`; cnt.setAttribute("textLength", 203 * bk * (`${n}/23`.length / 5)); pct.textContent = `${Math.round(prog.v * 100)}%`;
  fill.setAttribute("width", fullW * prog.v); };
drawProg();

// Circle-wipe transitions.
const wipe = (root, x, y) => gsap.fromTo(root, { clipPath: `circle(0px at ${x}px ${y}px)` },
  { clipPath: `circle(3600px at ${x}px ${y}px)`, duration: 0.7, ease: "power3.in" });

const tl = gsap.timeline({ paused: true });
tl.add(S1.tl.play(0), 0)
  .to(score, { v: 80, duration: 1.1, ease: "power2.out", onUpdate: drawScore }, 0.55)
  .to(ov, { opacity: 0, duration: 0.25 }, 1.85)
  .fromTo(S1.root, { scale: 1 }, { scale: 1.04, duration: 3.1, ease: "none", transformOrigin: "50% 55%" }, 0)
  .add(wipe(S2.root, 630, 3100), 2.55)
  .add(S2.tl.play(0), 2.7)
  .fromTo(S2.root, { scale: 1 }, { scale: 1.04, duration: 3.2, ease: "none", transformOrigin: "50% 55%" }, 2.55)
  .add(wipe(S3.root, 630, 3100), 5.15)
  .add(S3.tl.timeScale(1.3).play(0), 5.3)
  .fromTo(S3.root, { scale: 1 }, { scale: 1.035, duration: 2.85, ease: "none", transformOrigin: "50% 45%" }, 5.15);
tl.set(S1.root, { visibility: "hidden" }, 3.2).set(S2.root, { visibility: "hidden" }, 5.8);
tl.to(prog, { v: 1, duration: 1.05, ease: "power1.inOut", onUpdate: drawProg }, 6.15)
  .to(ov3, { opacity: 0, duration: 0.25 }, 7.45);
tl.set({}, {}, 8.0);

await document.fonts.ready;
window.__tl = tl;
const OFFSET = Number(new URLSearchParams(location.search).get("t") || 0);
window.__seek = async (t) => {
  tl.seek(t + OFFSET, false);
  await new Promise((r) => requestAnimationFrame(() => r()));
};
</script></body></html>
