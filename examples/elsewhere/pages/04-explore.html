<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
import { stage, device, lift, ready } from "shotsmith/kit";
import { box, landscape, title, pool, cardShadow } from "./system.js";

const SLICE = 3;
const s = await stage();
landscape(s, SLICE);
const tt = await title(s, { eyebrow: "explore.eyebrow", id: "explore.headline", sub: "explore.subline", align: "right" });

// Capture px, measured on each platform's map capture: the "Miradouro lookout" card (corner radius 22 pt).
const L = s.pick({
  tall: { x: 190, sw: 900, gap: -166, region: [72, 1800, 1098, 2151], radius: 66, pool: [900, 1800], contact: 2440 },
  p916: { x: 245, sw: 770, gap: -230, region: [91, 1608, 989, 1916], radius: 58, pool: [700, 1500], contact: 2000 },
});
pool(s, { top: L.pool[0], height: L.pool[1], rgb: "150,130,230", a: 0.26 });
// soft contact shadow on the water under the phone
box(s.root, `left:80px;top:${L.contact}px;width:1100px;height:240px;z-index:6;transform:rotate(-5deg);` +
  "background:radial-gradient(closest-side, rgba(8,4,22,0.55), rgba(8,4,22,0) 100%)");
// the phone lies back like a map on a table; the saved place stands up out of it, facing the viewer
const d = await device({ capture: "elsewhere-map", x: L.x, y: tt.bottom + L.gap, width: L.sw, repaint: true, finish: "silver", z: 10,
  tilt: "perspective(2600px) rotateX(24deg) rotateZ(-7deg)" });
d.el.style.transformOrigin = "50% 100%";
const h = (L.region[3] - L.region[1]) * d.k * 1.12;
const card = lift(d, { region: L.region, radius: L.radius, mode: "recess", scale: 1.12, shadow: cardShadow(h, 0.5, 0.6) });
card.style.transformOrigin = "50% 100%";
card.style.transform = "translateZ(40px) rotateX(-24deg)";
await ready();
</script></body></html>
