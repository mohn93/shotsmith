name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Manual runs never publish; this is always a dry run
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and ffmpeg
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
          sudo apt-get install -y ffmpeg
      - name: Check the release
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/check-release.mjs ${TAG:+"$TAG"}
      - run: npm run lint
      - run: npm test
      - run: npm run pack-skill
      - run: npm publish --dry-run --ignore-scripts

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      - name: Check the release
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/check-release.mjs ${TAG:+"$TAG"}
      - run: npm run pack-skill
      - name: Publish to npm
        run: npm publish
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/store-screenshots-*.zip --title "Shotsmith ${TAG#v}" --notes-file release/notes.md --verify-tag
