name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
          # Ubuntu 26 check ahead of ubuntu-latest moving to it on 2026-10-19; remove once ubuntu-latest is 26.04.
          - { os: ubuntu-26.04, node: 24 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ matrix.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
          sudo apt-get install -y ffmpeg
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
      - name: Install Chromium and ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          npx playwright install chromium
          brew install ffmpeg
      - run: npm run lint
      - run: npm test
      # A missing baseline is written and its test fails; this keeps the new images for review.
      - name: Keep baselines for review
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baselines-${{ matrix.os }}-node${{ matrix.node }}
          path: test/baselines/
          if-no-files-found: ignore
      - name: Build the examples
        run: node scripts/build-examples.mjs
      - name: Check the package contents
        run: npm pack --dry-run --ignore-scripts
