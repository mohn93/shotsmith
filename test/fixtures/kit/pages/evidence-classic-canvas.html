<!doctype html><html><head><meta charset="utf-8"></head><body><canvas id="early" width="600" height="120" style="position:absolute;left:100px;top:1500px;z-index:5"></canvas>
<script>const x = document.getElementById("early").getContext("2d"); x.font = "40px sans-serif"; x.fillStyle = "#fff"; x.fillText("Free forever", 10, 60);</script>
<script type="module">
import { stage, t, ready } from "shotsmith/kit";
const s = await stage();
const h = t.el("div", "headline", s.root);
Object.assign(h.style, { position: "absolute", left: "80px", top: "300px", width: "1100px", font: "700 80px var(--font-display)", color: "#fff" });
const box = document.createElement("div");
Object.assign(box.style, { position: "absolute", left: "80px", top: "900px", width: "1100px", font: "400 40px var(--font-text)", color: "#fff" });
s.root.appendChild(box);

await ready();
</script></body></html>
