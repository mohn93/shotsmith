<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script type="module">
import { stage, capture, ready } from "shotsmith/kit";
const s = await stage();
const q = new URL(location.href).searchParams;
const img = await capture(q.get("c") ?? "home");
// Page art: the card row of the capture, cropped onto a canvas without a frame.
const c = document.createElement("canvas");
c.width = 990; c.height = 300;
c.getContext("2d").drawImage(img, 90, 600, 990, 300, 0, 0, 990, 300);
Object.assign(c.style, { position: "absolute", left: "135px", top: "400px" });
s.root.appendChild(c);
await ready();
</script>
</body></html>
