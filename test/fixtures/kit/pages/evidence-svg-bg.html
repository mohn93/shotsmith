<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
import { stage, t, ready } from "shotsmith/kit";
const s = await stage();
const h = t.el("div", "headline", s.root);
Object.assign(h.style, { position: "absolute", left: "80px", top: "300px", width: "1100px", font: "700 80px var(--font-display)", color: "#fff" });
const box = document.createElement("div");
Object.assign(box.style, { position: "absolute", left: "80px", top: "900px", width: "1100px", font: "400 40px var(--font-text)", color: "#fff" });
s.root.appendChild(box);
const svg = "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"600\" height=\"100\"><text x=\"10\" y=\"60\" font-size=\"40\" fill=\"white\">Free forever</text></svg>";
const x = document.createElement("div"); x.style.cssText = "width:600px;height:100px"; x.style.backgroundImage = `url("data:image/svg+xml,${encodeURIComponent(svg)}")`; box.appendChild(x);
await ready();
</script></body></html>
