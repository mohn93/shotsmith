<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
import { stage, t, ready } from "shotsmith/kit";
const s = await stage();
t.el("div", "headline", s.root).style.cssText = "position:absolute;left:80px;top:100px;font:700 60px var(--font-display);color:#fff";
const grid = document.createElement("div");
grid.style.cssText = "position:absolute;left:0;top:300px;width:1260px;display:grid;grid-template-columns:repeat(10,1fr);font:400 14px var(--font-text);color:#fff";
for (let i = 0; i < 10000; i++) {
  const b = document.createElement("div");
  b.style.cssText = "padding:2px;overflow:hidden";
  b.innerHTML = `<span>Block ${i}</span>`;
  grid.appendChild(b);
}
s.root.appendChild(grid);
const t0 = performance.now();
await ready();
window.__readyMs = performance.now() - t0;
</script></body></html>
