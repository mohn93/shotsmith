<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
import { stage, t, device, lift, ready } from "shotsmith/kit";
const s = await stage();
s.root.style.background = "#1b2a3a";
const h = t.el("div", "headline", s.root);
Object.assign(h.style, { position: "absolute", left: "80px", top: "60px", width: "1100px", font: "700 60px var(--font-display)", color: "#fff" });
const d = await device({ capture: "home", x: 180, y: 260, width: 900, shadow: false, repaint: true });
lift(d, { region: [90, 600, 990, 900], mode: "recess", at: [630, 2400], scale: 1 });
await ready();
</script></body></html>
