<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
import { stage, headline, device, ready } from "shotsmith/kit";
const s = await stage();
s.root.style.background = "linear-gradient(#1b2a3a,#0b1020)";
const h = document.createElement("div");
Object.assign(h.style, { position: "absolute", left: "90px", top: s.pick({ tall: 220, p916: 150, t43: 120, t916: 170 }) + "px", width: "1080px", color: "#fff", fontFamily: "var(--font-display)", fontWeight: "700" });
s.root.appendChild(h);
const r = await headline(h, "headline", { maxSize: 104 });
await device({ capture: "home", x: 230, y: r.bottom + 80, width: s.pick({ tall: 800, p916: 620, t43: 520, t916: 640 }) });
await ready();
</script></body></html>
