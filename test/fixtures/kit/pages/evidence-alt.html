<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
import { stage, t, ready } from "shotsmith/kit";
const s = await stage();
const h = t.el("div", "headline", s.root);
Object.assign(h.style, { position: "absolute", left: "80px", top: "300px", width: "1100px", font: "700 80px var(--font-display)", color: "#fff" });
const box = document.createElement("div");
Object.assign(box.style, { position: "absolute", left: "80px", top: "900px", width: "1100px", font: "400 40px var(--font-text)", color: "#fff" });
s.root.appendChild(box);
const i = document.createElement("img"); i.alt = "Free forever"; box.appendChild(i);
const b = document.createElement("input"); b.type = "image"; b.alt = "Also shown"; b.src = "/missing-button.png"; box.appendChild(b);
await new Promise((r) => { b.onerror = r; });
await ready();
</script></body></html>
