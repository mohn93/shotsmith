<!doctype html><html><head><meta charset="utf-8"></head><body><div id="early" style="position:absolute;left:100px;top:1500px;z-index:5;color:#fff;font:40px sans-serif"></div>
<script>document.getElementById("early").attachShadow({ mode: "closed" }).innerHTML = "<p>Free forever</p>";</script>
<script type="module">
import { stage, t, ready } from "shotsmith/kit";
const s = await stage();
const h = t.el("div", "headline", s.root);
Object.assign(h.style, { position: "absolute", left: "80px", top: "300px", width: "1100px", font: "700 80px var(--font-display)", color: "#fff" });
const box = document.createElement("div");
Object.assign(box.style, { position: "absolute", left: "80px", top: "900px", width: "1100px", font: "400 40px var(--font-text)", color: "#fff" });
s.root.appendChild(box);

await ready();
</script></body></html>
