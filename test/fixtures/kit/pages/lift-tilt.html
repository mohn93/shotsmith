<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
import { stage, device, lift, ready } from "shotsmith/kit";
const s = await stage();
s.root.style.background = "#1b2a3a";
const d = await device({ capture: "home", x: 180, y: 260, width: 900, shadow: false, tilt: 12 });
lift(d, { region: [90, 600, 1080, 900], mode: "recess", at: d.toLocal(585, 1800), scale: 1 });
await ready();
</script></body></html>
